[build-system]
requires = ["setuptools>=75.0", "wheel", "grpcio-tools>=1.70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anedya-nexus-sdk"
version = "0.0.1"
description = "[Alpha] Official Anedya SDK for Python — dual transport (gRPC + HTTP)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Anedya", email = "support@anedya.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "protobuf>=5.29.0",
    "httpx>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/anedyaio/anedya-nexus-sdk-python"
Repository = "https://github.com/anedyaio/anedya-nexus-sdk-python"
Issues = "https://github.com/anedyaio/anedya-nexus-sdk-python/issues"
Documentation = "https://docs.anedya.io"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "grpcio-tools>=1.70.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["anedya.nexus*"]
namespaces = true

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
