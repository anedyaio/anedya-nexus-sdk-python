[build-system]
requires = ["setuptools>=75.0", "wheel", "grpcio-tools>=1.70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anedya-sdk"
version = "0.1.0"
description = "Official Anedya SDK for Python — dual transport (gRPC + HTTP)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Anedya", email = "support@anedya.io" },
]

dependencies = [
    "grpcio>=1.70.0",
    "grpcio-tools>=1.70.0",
    "protobuf>=5.29.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "grpcio-tools>=1.70.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anedya.sdk._generated" = ["*.pyi", "py.typed"]
